name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Tallinn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Requirement suite
        run: node tests/spec.js SmartHeatingWithShelly.js
      - name: Targeted mutations
        run: node tests/mutations.js
